# Builds the solution and runs the unit tests on every push and pull request to main.
# Needs no secrets: building does not read configuration, and the tests use an
# in-memory SQLite database (no Azure SQL, User Secrets or credentials).
name: .NET build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TaskTracker.sln

      - name: Build (warnings as errors)
        run: dotnet build TaskTracker.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test TaskTracker.sln --configuration Release --no-build --verbosity normal
